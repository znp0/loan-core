packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Align the optional Nest CLI builders with the CLI's webpack peer range.
  webpack: 5.111.0
allowBuilds:
  "@nestjs/core": false
  "@prisma/client": false
  "@prisma/engines": true
  "@swc/core": true
  prisma: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.10"
  - "@turbo/darwin-arm64@2.11.10"
  - "@turbo/linux-64@2.11.10"
  - "@turbo/linux-arm64@2.11.10"
  - "@turbo/windows-64@2.11.10"
  - "@turbo/windows-arm64@2.11.10"
  - turbo@2.11.10
