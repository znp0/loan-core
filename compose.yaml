name: loan-core

x-service-defaults: &service-defaults
  init: true
  environment: &service-environment
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3000"
  stop_grace_period: 10s

services:
  identity-service:
    <<: *service-defaults
    env_file:
      - path: ./apps/identity-service/.env
        required: false
    image: loan-core/identity-service:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: identity-service
    ports:
      - "127.0.0.1:3001:3000"

  loan-product-service:
    <<: *service-defaults
    env_file:
      - path: ./apps/loan-product-service/.env
        required: false
    image: loan-core/loan-product-service:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: loan-product-service
    ports:
      - "127.0.0.1:3002:3000"

  loan-application-service:
    <<: *service-defaults
    environment:
      <<: *service-environment
      LOAN_PRODUCT_SERVICE_URL: http://loan-product-service:3000
      REPAYMENT_SERVICE_URL: http://repayment-service:3000
    env_file:
      - path: ./apps/loan-application-service/.env
        required: false
    image: loan-core/loan-application-service:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: loan-application-service
    ports:
      - "127.0.0.1:3003:3000"

  repayment-service:
    <<: *service-defaults
    env_file:
      - path: ./apps/repayment-service/.env
        required: false
    image: loan-core/repayment-service:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: repayment-service
    ports:
      - "127.0.0.1:3004:3000"
