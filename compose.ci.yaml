services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only-password
    volumes:
      - ./scripts/ci-databases.sql:/docker-entrypoint-initdb.d/ci-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres --dbname postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

  identity-service:
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql://identity_service:test-only-password@postgres:5432/identity
      JWT_SECRET: ci-only-loan-core-jwt-signing-secret
    depends_on:
      postgres:
        condition: service_healthy

  loan-product-service:
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql://loan_product_service:test-only-password@postgres:5432/loan_products
      PRODUCT_INTERNAL_TOKEN: test-only-product-internal-token
    depends_on:
      postgres:
        condition: service_healthy

  loan-application-service:
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql://loan_application_service:test-only-password@postgres:5432/loan_applications
      JWT_SECRET: ci-only-loan-core-jwt-signing-secret
      PRODUCT_INTERNAL_TOKEN: test-only-product-internal-token
      REPAYMENT_INTERNAL_TOKEN: test-only-repayment-internal-token
    depends_on:
      postgres:
        condition: service_healthy

  repayment-service:
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql://repayment_service:test-only-password@postgres:5432/repayment
      JWT_SECRET: ci-only-loan-core-jwt-signing-secret
      REPAYMENT_INTERNAL_TOKEN: test-only-repayment-internal-token
    depends_on:
      postgres:
        condition: service_healthy
