name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --env-file /dev/null config --quiet
      - run: docker compose --env-file /dev/null up --build --wait --wait-timeout 120
      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file /dev/null logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose --env-file /dev/null down --remove-orphans
