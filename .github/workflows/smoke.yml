name: Smoke tests

on:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --env-file docker/test.env --file compose.test.yaml config --quiet
      - name: Run the same test environment as local development
        run: docker compose --env-file docker/test.env --file compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Show test logs on failure
        if: failure()
        run: docker compose --env-file docker/test.env --file compose.test.yaml logs --no-color
      - name: Remove the disposable test environment
        if: always()
        run: docker compose --env-file docker/test.env --file compose.test.yaml down --remove-orphans --volumes

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --env-file /dev/null --file compose.yaml --file compose.ci.yaml config --quiet
      - run: docker compose --env-file /dev/null --file compose.yaml --file compose.ci.yaml up --build --wait --wait-timeout 120
      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file /dev/null --file compose.yaml --file compose.ci.yaml logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose --env-file /dev/null --file compose.yaml --file compose.ci.yaml down --remove-orphans --volumes
